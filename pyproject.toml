[project]
name = "secure-rag-pinecone-openai"
version = "1.0.0"
description = "Production-oriented secure RAG reference implementation with OpenAI + Pinecone"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "openai>=1.99,<2",
  "pinecone>=7,<8",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "slowapi>=0.1.9,<1",
  "redis>=5,<6",
  "bleach>=6.2,<7",
  "tenacity>=9.1,<10",
  "PyJWT>=2.10,<3",
  "cryptography>=45,<46",
  "email-validator>=2.3,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "aiosqlite>=0.21,<1",
  "pip-audit>=2.9,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

target-version = "py311"
